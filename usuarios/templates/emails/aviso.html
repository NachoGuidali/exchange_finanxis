<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title></head>
<body style="margin:0;padding:0;background:#f2f2f4;font-family:Arial,Helvetica,sans-serif;color:#1c1c20">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f4;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden">
        <tr><td style="background:#1c1c20;padding:18px 28px;color:#ffffff;font-size:18px;font-weight:bold;letter-spacing:.5px">
          {{ empresa|upper }}<span style="color:#FF1129">.</span>
        </td></tr>
        <tr><td style="padding:28px">
          <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#1c1c20">{{ titulo }}</h1>
          <div style="font-size:15px;line-height:1.6;color:#3f3f46;white-space:pre-line">{{ texto }}</div>
          {% if boton_url %}
          <p style="margin:24px 0 0"><a href="{{ boton_url }}" style="display:inline-block;background:#FF1129;color:#000000;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:999px">{{ boton_texto|default:"Abrir" }}</a></p>
          {% endif %}
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;line-height:1.5">
          Este es un aviso automático de {{ empresa }}. Si no reconocés esta actividad, escribinos desde la sección Soporte.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
