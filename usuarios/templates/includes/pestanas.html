{% with ruta=request.resolver_match.url_name %}
<nav class="pestanas lg:hidden" aria-label="Accesos rápidos">
  <a href="{% url 'dashboard' %}" {% if ruta == 'dashboard' %}aria-current="page"{% endif %}>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
    Inicio
  </a>
  <a href="{% url 'agregar_saldo' %}" {% if ruta == 'agregar_saldo' or ruta == 'depositar_usdt' %}aria-current="page"{% endif %}>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v12m0 0-4.5-4.5M12 16l4.5-4.5M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Ingresar
  </a>
  <a href="{% url 'operar' %}" class="pestana-operar" {% if ruta == 'operar' or ruta == 'confirmar_operacion' %}aria-current="page"{% endif %}>
    <span class="icono"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Operar
  </a>
  <a href="{% url 'mis_movimientos' %}" {% if ruta == 'mis_movimientos' %}aria-current="page"{% endif %}>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" stroke-linecap="round"/></svg>
    Movimientos
  </a>
  <a href="{% url 'solicitar_retiro' %}" {% if ruta == 'solicitar_retiro' %}aria-current="page"{% endif %}>
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Retirar
  </a>
</nav>
{% endwith %}
